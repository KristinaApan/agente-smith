[project]
name = "ejercicio-3-2-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av==15.1.0",
    "faster-whisper>=1.2.1",
    "librosa>=1.0.0",
    "onnxruntime-gpu==1.24.4",
    "onnxscript>=0.7.2",
    "openai>=3.24.0",
    "openwakeword>=0.4.0",
    "pillow>=12.3.0",
    "qwen-tts>=0.1.1",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.17.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
